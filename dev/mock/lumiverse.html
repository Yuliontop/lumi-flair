<!doctype html><html data-theme-mode="dark" data-glass><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root {
  /* Primary purple accent */
  --lumiverse-primary: rgba(147, 112, 219, 0.9);
  --lumiverse-primary-hover: rgba(167, 132, 239, 0.95);
  --lumiverse-primary-light: rgba(147, 112, 219, 0.1);
  --lumiverse-primary-muted: rgba(147, 112, 219, 0.6);
  --lumiverse-primary-text: rgba(186, 135, 255, 0.95);
  --lumiverse-primary-010: rgba(147, 112, 219, 0.1);
  --lumiverse-primary-015: rgba(147, 112, 219, 0.15);
  --lumiverse-primary-020: rgba(147, 112, 219, 0.2);
  --lumiverse-primary-050: rgba(147, 112, 219, 0.5);
  /* Semantic accent alias used by component surfaces. */
  --lumiverse-primary-soft: var(--lumiverse-primary-015);
  --lumiverse-primary-deep: rgb(26 20 39);
  --lumiverse-primary-deep-hover: rgb(38 29 57);
  --lumiverse-primary-deep-contrast: hsl(273, 30%, 95%);

  /* Secondary gray tones */
  --lumiverse-secondary: rgba(128, 128, 128, 0.15);
  --lumiverse-secondary-hover: rgba(128, 128, 128, 0.25);
  --lumiverse-secondary-border: rgba(128, 128, 128, 0.25);

  /* Status colors */
  --lumiverse-danger: #ef4444;
  --lumiverse-danger-hover: #dc2626;
  --lumiverse-danger-015: rgba(239, 68, 68, 0.15);
  --lumiverse-danger-020: rgba(239, 68, 68, 0.2);
  --lumiverse-danger-050: rgba(239, 68, 68, 0.5);
  --lumiverse-success: #22c55e;
  --lumiverse-success-015: rgba(34, 197, 94, 0.15);
  --lumiverse-success-020: rgba(34, 197, 94, 0.2);
  --lumiverse-success-050: rgba(34, 197, 94, 0.5);
  --lumiverse-warning: #f59e0b;
  --lumiverse-warning-015: rgba(245, 158, 11, 0.15);
  --lumiverse-warning-020: rgba(245, 158, 11, 0.2);
  --lumiverse-warning-050: rgba(245, 158, 11, 0.5);
  --lumiverse-error: var(--lumiverse-danger);

  /* Dark purple-tinted backgrounds */
  --lumiverse-bg: rgba(28, 24, 38, 0.95);
  --lumiverse-bg-opaque: rgb(28 24 38);
  --lumiverse-bg-elevated: rgba(35, 30, 48, 0.9);
  --lumiverse-bg-hover: rgba(45, 40, 58, 0.9);
  --lumiverse-bg-dark: rgba(0, 0, 0, 0.15);
  --lumiverse-bg-darker: rgba(0, 0, 0, 0.25);
  --lumiverse-bg-040: rgba(28, 24, 38, 0.4);
  --lumiverse-bg-050: rgba(28, 24, 38, 0.5);
  --lumiverse-bg-070: rgba(28, 24, 38, 0.7);
  --lumiverse-bg-elevated-040: rgba(35, 30, 48, 0.4);
  --lumiverse-bg-deep-080: rgba(20, 17, 28, 0.8);
  --lumiverse-scene-text-scrim: rgba(7, 9, 16, 0.46);

  /* Semantic material ladder. These are public aliases consumed by newer
     component CSS and kept in lockstep with the canonical theme engine. */
  --lumiverse-surface: var(--lumiverse-bg);
  --lumiverse-surface-raised: var(--lumiverse-bg-elevated);
  --lumiverse-surface-hover: var(--lumiverse-bg-hover);
  --lumiverse-surface-muted: var(--lumiverse-fill-subtle);

  /* Subtle purple-tinted borders */
  --lumiverse-border: rgba(147, 112, 219, 0.12);
  --lumiverse-border-hover: rgba(147, 112, 219, 0.25);
  --lumiverse-border-light: rgba(128, 128, 128, 0.12);
  --lumiverse-border-subtle: var(--lumiverse-border-light);

  /* Text colors */
  --lumiverse-text: rgba(255, 255, 255, 0.9);
  --lumiverse-text-muted: rgba(255, 255, 255, 0.65);
  --lumiverse-text-dim: rgba(255, 255, 255, 0.4);
  --lumiverse-text-hint: rgba(255, 255, 255, 0.3);
  --lumiverse-text-primary: var(--lumiverse-text);
  --lumiverse-text-secondary: var(--lumiverse-text-muted);

  /* Border radii */
  --lumiverse-radius-sm: 5px;
  --lumiverse-radius: 8px;
  --lumiverse-radius-md: 10px;
  --lumiverse-radius-lg: 12px;
  --lumiverse-radius-xl: 16px;

  /* Shadows */
  --lumiverse-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  --lumiverse-shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --lumiverse-shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --lumiverse-shadow-lg: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 1px rgba(147, 112, 219, 0.3);
  --lumiverse-shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.5);

  /* Highlight insets */
  --lumiverse-highlight-inset: inset 0 1px 0 rgba(255, 255, 255, 0.1);
  --lumiverse-highlight-inset-md: inset 0 1px 0 rgba(255, 255, 255, 0.2);
  --lumiverse-highlight-inset-lg: inset 0 1px 0 rgba(255, 255, 255, 0.25);

  /* Modal & overlays */
  --lumiverse-modal-backdrop: rgba(0, 0, 0, 0.6);
  --lumiverse-swatch-border: rgba(255, 255, 255, 0.15);
  --lumiverse-gradient-modal: linear-gradient(135deg, rgba(35, 30, 48, 0.98), rgba(20, 17, 28, 0.98));

  /* Icon colors */
  --lumiverse-icon: rgba(255, 255, 255, 0.9);
  --lumiverse-icon-muted: rgba(255, 255, 255, 0.6);
  --lumiverse-icon-dim: rgba(255, 255, 255, 0.4);

  /* Fill colors */
  --lumiverse-fill-subtle: rgba(0, 0, 0, 0.1);
  --lumiverse-fill: rgba(0, 0, 0, 0.15);
  --lumiverse-input-bg: var(--lumiverse-fill);
  --lumiverse-fill-hover: rgba(0, 0, 0, 0.2);
  --lumiverse-fill-medium: rgba(0, 0, 0, 0.25);
  --lumiverse-fill-strong: rgba(0, 0, 0, 0.3);
  --lumiverse-fill-heavy: rgba(0, 0, 0, 0.5);
  --lumiverse-fill-deepest: rgba(0, 0, 0, 0.7);

  /* Card backgrounds */
  --lumiverse-card-bg: linear-gradient(165deg, rgba(28, 24, 38, 1) 0%, rgba(24, 20, 34, 1) 50%, rgba(20, 17, 30, 1) 100%);
  /* Solid color extracted from --lumiverse-card-bg for use inside other
     gradients (CSS can't interpolate a gradient-valued variable as a color
     stop). Uses the mid-stop color. */
  --lumiverse-card-bg-solid: rgb(24, 20, 34);
  --lumiverse-card-bg-top: rgb(28, 24, 38);
  --lumiverse-card-bg-bottom: rgb(20, 17, 30);
  --lumiverse-card-image-bg: linear-gradient(135deg, rgba(20, 17, 28, 1) 0%, rgba(28, 22, 40, 1) 100%);

  /* Neutral borders */
  --lumiverse-border-neutral: rgba(128, 128, 128, 0.15);
  --lumiverse-border-neutral-hover: rgba(128, 128, 128, 0.25);

  /* Transitions */
  --lumiverse-transition: 200ms ease;
  --lumiverse-transition-fast: 150ms ease;

  /* Button sizing */
  --lumiverse-btn-icon: 32px;
  --lumiverse-btn-icon-sm: 28px;
  --lumiverse-btn-icon-xs: 22px;
  --lumiverse-btn-tab: 32px;

  /* Typography */
  --lumiverse-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  --lumiverse-font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;

  /* Chat — glassmorphic tokens */
  --lcs-glass-bg: rgba(18, 16, 28, 0.55);
  --lcs-glass-bg-hover: rgba(24, 21, 36, 0.65);
  --lcs-glass-border: rgba(255, 255, 255, 0.06);
  --lcs-glass-border-hover: rgba(255, 255, 255, 0.1);
  --lcs-glass-blur: 8px;
  --lcs-glass-soft-blur: 6px;
  --lcs-glass-strong-blur: 12px;
  --lcs-radius: 14px;
  --lcs-radius-sm: 8px;
  --lcs-radius-xs: 5px;
  --lcs-transition: 220ms cubic-bezier(0.4, 0, 0.2, 1);
  --lcs-transition-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
  --lumiverse-bg-deep: rgba(10, 8, 18, 1);
  --lumiverse-font-scale: 1;
  --lumiverse-ui-scale: 1;

  /* Chat — prose tokens */
  --lumiverse-prose-italic: var(--lumiverse-text-muted);
  --lumiverse-prose-bold: inherit;
  --lumiverse-prose-dialogue: var(--lumiverse-primary-text);
  --lumiverse-prose-blockquote: var(--lumiverse-text-muted);
}

@media (max-width: 600px) {
  :root {
    --lumiverse-btn-icon: 40px;
    --lumiverse-btn-icon-sm: 34px;
    --lumiverse-btn-icon-xs: 28px;
    --lumiverse-btn-tab: 38px;
  }
}

</style><style>/* ── Bubble mode card ── */
.B_card {
  /* User-tunable bubble fill alpha. --lcs-bubble-opacity (set on :root by
     ChatView) scales the theme's glass fill toward transparent; at the default
     1 these resolve to the unmodified glass colors, so the look is unchanged. */
  --lcs-bubble-bg: color-mix(in srgb, var(--lcs-glass-bg) calc(var(--lcs-bubble-opacity, 1) * 100%), transparent);
  --lcs-bubble-bg-hover: color-mix(in srgb, var(--lcs-glass-bg-hover, rgba(24, 22, 36, 0.65)) calc(var(--lcs-bubble-opacity, 1) * 100%), transparent);
  --long-message-fade-color: var(--lcs-bubble-bg);
  display: flex;
  flex-shrink: 0;
  gap: 10px;
  position: relative;
  overflow: hidden;
  border-radius: var(--lcs-radius, 14px);
  padding: 0;
  border: none;
  contain: layout style paint;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.022) 0%, rgba(255, 255, 255, 0.007) 40%, rgba(255, 255, 255, 0.013) 100%),
    var(--lcs-bubble-bg);
  box-shadow: 0 0 0 0.5px var(--lcs-glass-border);
  backdrop-filter: none;
  transition:
    background var(--lcs-transition-fast),
    border-color var(--lcs-transition-fast),
    box-shadow 0.15s ease;
}

/* The normal card is paint-contained and clipped to keep its glass treatment
   cheap. Authored HTML islands and inline-card spacing shells need visual
   overflow for box/text shadows and transformed corners, so relax both clips
   only for cards containing either one. */
.B_card:has([data-lumiverse-html-island]),
.B_card:has([data-lumiverse-inline-html-card]) {
  overflow: visible;
  contain: layout style;
}

/* Hide accent bars */
.B_card::before {
  display: none;
}

/* Bottom specular highlight */
.B_card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 12%;
  right: 12%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
  pointer-events: none;
  z-index: 2;
}

/* Character tint */
.B_character {
  flex-direction: row;
  background:
    linear-gradient(145deg, var(--lcs-glass-char-tint, rgba(100, 120, 255, 0.03)) 0%, transparent 40%),
    linear-gradient(145deg, rgba(255, 255, 255, 0.022) 0%, rgba(255, 255, 255, 0.007) 40%, rgba(255, 255, 255, 0.013) 100%),
    var(--lcs-bubble-bg);
}

/* User tint */
.B_user {
  flex-direction: row-reverse;
  background:
    linear-gradient(225deg, var(--lcs-glass-user-tint, rgba(255, 180, 100, 0.03)) 0%, transparent 40%),
    linear-gradient(145deg, rgba(255, 255, 255, 0.022) 0%, rgba(255, 255, 255, 0.007) 40%, rgba(255, 255, 255, 0.013) 100%),
    var(--lcs-bubble-bg);
}

/* Left-aligned user override — mirrors character layout */
.B_userLeft.B_user {
  flex-direction: row;
}

/* Virtualized rows only mount near the viewport, so avoid scroll-time DOM
   attribute toggles here. Toggling a public attribute let custom CSS change
   row size during measurement, which could feed back into virtualization.

   Heavy drop shadows are gated behind data-glass so that disabling glass
   effects (Theme > "Disable glass effects") also drops the expensive GPU
   shadow stack. The non-glass fallback is a hairline border shadow only. */
.B_card {
  box-shadow: 0 0 0 0.5px var(--lcs-glass-border);
}

[data-glass] .B_card {
  box-shadow:
    0 0 0 0.5px var(--lcs-glass-border),
    0 2px 6px rgba(0, 0, 0, 0.2),
    0 8px 24px rgba(0, 0, 0, 0.12);
}

/* Only apply backdrop-filter when glass is enabled AND there's a non-solid
   background (image/video/scene). Blurring a solid color is pure GPU waste. */
:global([data-glass][data-chat-bg]) .B_card {
  backdrop-filter: blur(var(--lcs-glass-strong-blur, 12px)) saturate(1.2);
}

.B_card.B_streaming {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: 0 0 0 0.5px var(--lcs-glass-border) !important;
}

.B_streaming .B_avatarBg,
.B_streaming .B_avatarBgScrim {
  display: none !important;
}

.B_card:hover {
  box-shadow:
    0 0 0 0.5px var(--lcs-glass-border-hover, rgba(255, 255, 255, 0.1)),
    0 1px 2px rgba(0, 0, 0, 0.28);
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.028) 0%, rgba(255, 255, 255, 0.01) 40%, rgba(255, 255, 255, 0.018) 100%),
    var(--lcs-bubble-bg-hover);
}

[data-glass] .B_card:hover {
  box-shadow:
    0 0 0 0.5px var(--lcs-glass-border-hover, rgba(255, 255, 255, 0.1)),
    0 1px 2px rgba(0, 0, 0, 0.28),
    0 4px 16px rgba(0, 0, 0, 0.22),
    0 20px 56px rgba(0, 0, 0, 0.12),
    inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
}

/* Light themes use a light hover fill fallback, so derive the bubble hover var
   from it instead of the dark default. */
[data-theme-mode='light'] .B_card {
  --lcs-bubble-bg-hover: color-mix(in srgb, var(--lcs-glass-bg-hover, rgba(255, 255, 255, 0.75)) calc(var(--lcs-bubble-opacity, 1) * 100%), transparent);
}

[data-theme-mode='light'] .B_card:hover {
  box-shadow:
    0 0 0 0.5px rgba(0, 0, 0, 0.06),
    0 1px 2px rgba(0, 0, 0, 0.04);
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.04) 100%),
    var(--lcs-bubble-bg-hover);
}

:global([data-glass][data-theme-mode='light']) .B_card:hover {
  box-shadow:
    0 0 0 0.5px rgba(0, 0, 0, 0.06),
    0 1px 2px rgba(0, 0, 0, 0.04),
    0 4px 12px rgba(0, 0, 0, 0.05),
    inset 0 0.5px 0 rgba(255, 255, 255, 0.5);
}

/* Hide dissolving avatar background when user opts out */
[data-no-bubble-avatar-bg] .B_avatarBg {
  display: none;
}

/* Disable bubble hover effects when user opts out */
[data-no-bubble-hover] .B_card:hover {
  box-shadow: 0 0 0 0.5px var(--lcs-glass-border);
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.022) 0%, rgba(255, 255, 255, 0.007) 40%, rgba(255, 255, 255, 0.013) 100%),
    var(--lcs-bubble-bg);
}

:global([data-glass][data-no-bubble-hover]) .B_card:hover {
  box-shadow:
    0 0 0 0.5px var(--lcs-glass-border),
    0 1px 2px rgba(0, 0, 0, 0.2),
    0 4px 16px rgba(0, 0, 0, 0.14),
    0 12px 48px rgba(0, 0, 0, 0.08);
}

[data-no-bubble-hover] .B_card:hover .B_avatarBgImg {
  opacity: 0.28;
}

/* Hidden draft message — dimmed, darkened, dashed border */
.B_hidden {
  opacity: 0.4;
  border: 1px dashed var(--lumiverse-border);
  filter: brightness(0.6) saturate(0.5);
  transition:
    opacity var(--lcs-transition),
    filter var(--lcs-transition),
    background var(--lcs-transition-fast),
    border-color var(--lcs-transition-fast),
    box-shadow 0.15s ease;
}

.B_hidden:hover {
  opacity: 0.65;
  filter: brightness(0.75) saturate(0.7);
}

.B_hiddenBadge {
  color: rgba(255, 160, 80, 0.9);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: calc(9px * var(--lumiverse-font-scale, 1));
}

/* Selection mode */
.B_selectMode {
  cursor: pointer;
  user-select: none;
}

.B_selected {
  outline: 2px solid var(--lumiverse-primary);
  outline-offset: -1px;
  opacity: 1 !important;
  filter: none !important;
}

/* Transient navigation highlight — greeting switch, deep-link scroll-to, etc. */
.B_highlight {
  animation: bubbleHighlightPulse 1600ms ease-out forwards;
}

@keyframes bubbleHighlightPulse {
  0% {
    outline: 2px solid transparent;
    outline-offset: 2px;
    box-shadow: 0 0 0 0 var(--lumiverse-primary-040, rgba(130, 100, 255, 0.4));
  }
  15% {
    outline: 2px solid var(--lumiverse-primary);
    outline-offset: 2px;
    box-shadow: 0 0 0 6px var(--lumiverse-primary-020, rgba(130, 100, 255, 0.2));
  }
  100% {
    outline: 2px solid transparent;
    outline-offset: 2px;
    box-shadow: 0 0 0 0 transparent;
  }
}

/* Streaming state — GPU optimization */
.B_streaming {
  will-change: opacity, transform;
  backdrop-filter: none;
}

[data-style-mode='extension-relaxed'] .B_streaming {
  will-change: opacity;
}

[data-style-mode='extension-relaxed'] .B_card {
  contain: style;
}

/* Allow card authored extension-relaxed content to render at arbitrary z levels,
  as long as they stay below the sidebars. */
[data-style-mode='extension-relaxed'] .B_bubble,
[data-style-mode='extension-relaxed'] .B_content {
  z-index: auto;
}

/* ── Bubble inner content ── */
.B_bubble {
  flex: 1;
  min-width: 0;
  max-width: 100%;
  padding: 0;
  display: flex;
  flex-direction: column;
  /* Must sit above .B_avatarBg (z-index: 0) so the dissolving portrait
     doesn't overlay the header, reasoning block, or other bubble content. */
  position: relative;
  z-index: 1;
}

/* ── Header ── */
.B_header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 20px 24px 0;
  gap: 12px;
  margin-bottom: 0;
}

.B_user .B_header {
  flex-direction: row-reverse;
}

.B_userLeft.B_user .B_header {
  flex-direction: row;
}

.B_headerLeft {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  max-width: calc(100% - 180px);
}

.B_user .B_headerLeft {
  flex-direction: row-reverse;
  max-width: calc(100% - 155px);
}

.B_userLeft.B_user .B_headerLeft {
  flex-direction: row;
}

/* ── Avatar — 44px rounded-square ── */
.B_avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--lumiverse-fill-subtle);
  box-shadow:
    0 0 0 0.5px rgba(255, 255, 255, 0.08),
    0 2px 8px rgba(0, 0, 0, 0.3);
  border: none;
  position: relative;
  z-index: 1;
}

.B_avatarFallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(16px * var(--lumiverse-font-scale, 1));
  font-weight: 600;
  color: var(--lumiverse-primary-muted);
  background: var(--lumiverse-primary-010);
}

/* ── Name ── */
.B_name,
.B_nameChar,
.B_nameUser {
  font-size: calc(20px * var(--lumiverse-font-scale, 1));
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.2;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

[data-theme-mode='dark'] .B_nameChar {
  color: var(--char-name-dark, var(--lumiverse-primary-text));
}

[data-theme-mode='light'] .B_nameChar {
  color: var(--char-name-light, var(--lumiverse-primary-text));
}

/* ── Meta wrap ── */
.B_metaWrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 0;
}

.B_user .B_metaWrap {
  align-items: flex-end;
}

.B_userLeft.B_user .B_metaWrap {
  align-items: flex-start;
}

.B_user .B_metaPill {
  align-self: flex-end;
}

/* The right-aligned user badge should remain a single line. The left-aligned
   option retains the general wrapping behavior for backwards compatibility. */
.B_user:not(.B_userLeft) .B_metaPill {
  flex-shrink: 0;
  flex-wrap: nowrap;
  max-width: none;
  white-space: nowrap;
}

.B_userLeft.B_user .B_metaPill {
  align-self: flex-start;
}

/* Meta pill — monospace badge */
.B_metaPill {
  position: relative;
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  margin-top: 5px;
  padding: 4px 10px;
  border-radius: 16px;
  font-size: calc(11px * var(--lumiverse-font-scale, 1));
  font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace;
