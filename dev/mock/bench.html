<!doctype html><html><body style="margin:0"><canvas id="c" style="position:fixed;inset:0;width:100vw;height:100vh"></canvas>
<script type="module" src="build/bench.js"></script><script type="module" src="build/bench-base.js"></script>
<script>
window.bench = (lib, effect, k, runs=5) => {
  const L = window[lib]; const times = [];
  for (let r = 0; r < runs; r++) {
    const fx = new L.FxCanvas(document.getElementById('c'));
    const origRAF = window.requestAnimationFrame; window.requestAnimationFrame = () => 0; // drive frames manually
    L.playSendEffect(fx, effect, { x: 1100, y: 840 }, { r: 147, g: 112, b: 219 }, k, {});
    let t = performance.now(); fx.last = t; const t0 = performance.now();
    for (let f = 0; f < 150; f++) { t += 16.7; fx.tick(t) }
    times.push(performance.now() - t0); window.requestAnimationFrame = origRAF; fx.destroy();
  }
  times.sort((a,b)=>a-b); return (times[Math.floor(times.length/2)] / 150).toFixed(2) + ' ms/frame';
}
</script></body></html>
